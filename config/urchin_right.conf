# nice!nano v2 — right half (peripheral)

# enable bluetooth
CONFIG_BT=y
CONFIG_ZMK_BLE=y

# increase bluetooth signal power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# enable deep sleep support
CONFIG_ZMK_SLEEP=y

# 300,000 ms = 5 minutes idle before display blanking
CONFIG_ZMK_IDLE_TIMEOUT=300000
# 1,800,000 ms = 30 minutes before deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# enable display
CONFIG_ZMK_DISPLAY=y
# custom status screen (nice-view-gem)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# enable gem animation
CONFIG_NICE_VIEW_GEM_ANIMATION=y
